[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "mempeek"
version = "0.1.0"
description = "Cheat engine but in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erel Nahum", email = "nahum.erel@gmail.com" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "build", "ruff"]

[tool.ruff]
line-length = 88
target-version = "py311"
lint.extend-select = ["I", "F", "E", "W"]
exclude = ["build", "dist"]
